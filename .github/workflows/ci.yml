# T-163 · THIS WORKFLOW RUNS ON EVERY BRANCH, AND THAT IS THE POINT.
#
# It used to trigger `push` only on `[main, rimward-redesign]` — a hand-maintained
# allowlist — while every job below skipped same-repo PRs. Those two rules are
# individually reasonable and together they left a `redesign/*` branch with
# **zero** coverage: no push run because the branch was not on the list, and no PR
# run because the PR was same-repo. The suite never ran on the commit about to
# merge. It cost this repository twice:
#
#   F-112-D  T-1605 deleted the travel PILOT check; `starmap.spec.ts` still
#            asserted it. 7 of 95 specs sat RED on `main@74403ab4` from
#            2026-07-28 until T-112 tripped over them a fortnight later.
#   F-162-3  T-195 (`8ba4e83a`) shipped `navDieFuelDiscount` and
#            `navDieEvasionFactor` without an e2e run; six specs sat RED on
#            `redesign/explore-hangout` until T-162 tripped over them.
#
# Neither change "touched the cockpit", so `docs/ENGINEERING-POLICY.md` §2's local
# e2e requirement did not fire either. A rules change that a spec asserts against
# is exactly the change no branch-name allowlist can anticipate.
#
# WIDENING THE TRIGGER DOES NOT ADD DUPLICATE RUNS — it is what makes the
# no-duplicate rule TRUE for the first time. The job-level
# `github.event_name == 'push' || <fork>` skip below is unchanged, byte for byte.
# Its premise is "the push run of this same commit already tested it"; on an
# unlisted branch that premise was simply false. Now it holds everywhere, and a
# same-repo PR still runs exactly once — on the push.
#
# THE RULE THIS ENCODES: narrow a workflow by `paths` (a cost argument, which
# re-opens itself when the measured thing changes), never by branch name (a
# coverage argument that rots one branch at a time — see `sweep-gate.yml`, which
# had `redesign/explore-hangout` hand-added to its list). Enforced by
# `packages/ui/src/__tests__/ci-workflow.test.ts`; recorded in
# `docs/TESTING-STRATEGY.md` Part H and `docs/LESSONS.md` L-036.
name: CI

on:
  push:
    # EVERY branch. `['**']` matches names containing `/`
    # (`redesign/explore-hangout`), where a bare `*` would not; under
    # `push.branches` it still excludes tags. Do not re-enumerate.
    branches: ['**']
  pull_request:

# One CI run per branch tip: a new push cancels the superseded run for the
# same branch/PR — a commit that is no longer the tip answers no question.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, lint, test
    # Same-repo PRs are already tested by the push-triggered run of the same
    # commit; running both is pure duplication. Fork PRs produce no push run
    # here, so they still get tested.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Hard backstop against a true hang (not slowness) burning the 6-hour
    # default. The legitimate suite runs real multi-hundred-day Monte-Carlo sim
    # campaigns and clocks ~14 min today, so 15 gave almost no headroom and any
    # added test tipped it into a false cancel. 30 keeps ~2x room while still
    # tripping fast on an actual hang. If this climbs again, split the heavy sim
    # tests into their own parallel job rather than raising this further.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # T-1701a: skip Electron's ~100 MB binary download. This job never
      # launches the shell — it typechecks it, and `tsc -b` needs only the
      # `electron.d.ts` that ships inside the npm package, while
      # `saveStore.ts` deliberately imports no `electron` at all (asserted by
      # `packages/desktop/src/__tests__/saveStore.test.ts`), so `npm test` runs
      # the shell's unit suite without a binary. The `desktop` job below does
      # download it.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck & build
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  e2e:
    name: Playwright e2e
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # T-1701a: same reasoning as the `ci` job — this job proves the WEB build
      # and never launches Electron.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build workspaces
        run: npx tsc -b

      # Cache the downloaded chromium binary (~/.cache/ms-playwright on ubuntu
      # runners). package-lock.json pins @playwright/test, so its hash changes
      # exactly when the browser build Playwright wants can change.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/ui

      # System deps aren't covered by the cache — install just those on a hit.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: packages/ui

      - name: Run e2e
        run: npm run test:e2e
        working-directory: packages/ui

      # T-1602a acceptance artifact: the Tour One career run report (screens
      # visited, days elapsed, the full day log + encounter log). `always()` so a
      # FAILING career still yields its day log — which is exactly when it is
      # worth reading. `if-no-files-found: error` so the artifact criterion
      # cannot silently rot into an empty upload.
      - name: Upload Tour One run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-one-run-report
          path: packages/ui/test-results/tour-one/
          if-no-files-found: error

      # T-162 acceptance artifact: the long-haul DOM invariant sweep's run report
      # (days reached, steps, the whole invariant battery and every violation).
      # Same `always()` + `if-no-files-found: error` discipline as the sibling
      # above, and for the same two reasons: a RED long-haul report is the one
      # worth reading, and an artifact criterion must not rot into an empty
      # upload. No new job and no new trigger — `long-haul.spec.ts` lives in
      # `e2e/`, so `npm run test:e2e` above already collects it (one seed x 30
      # days by default; see the spec header for the cadence argument).
      - name: Upload long-haul invariant run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-haul-run-report
          path: packages/ui/test-results/longhaul/
          if-no-files-found: error

  # T-1701a · The Electron shell. A THIRD job, deliberately separate from `e2e`:
  # that job proves the WEB build and must keep proving exactly that, unchanged,
  # which together with this job is the "CI proves both" acceptance criterion.
  # It also keeps the ~100 MB Electron download off the two jobs that do not
  # need it.
  desktop:
    name: Electron desktop e2e
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron's postinstall downloads a per-platform binary into
      # ~/.cache/electron. package-lock.json pins the version, so its hash
      # changes exactly when the binary would.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Build workspaces
        run: npx tsc -b

      # Electron ships its own Chromium, so no browser download is needed — but
      # it needs the same GTK/NSS/ALSA system libraries, and `install-deps` is
      # the supported way to get them on a bare runner.
      - name: Install system deps
        run: npx playwright install-deps chromium
        working-directory: packages/desktop

      # `xvfb-run`: an Electron window needs a display server, and ubuntu
      # runners are headless. The window really is created and really does
      # paint — the shell e2e asserts `isVisible()`, which would fail otherwise.
      - name: Run desktop e2e
        run: xvfb-run -a npm run test:e2e
        working-directory: packages/desktop

  # T-1701b · The PACKAGED builds. A matrix rather than two jobs so the mac and
  # win halves cannot drift, and separate from `desktop` (which runs the DEV-mode
  # shell on ubuntu and must keep proving the unpackaged path unchanged). Between
  # them, `ci` + `e2e` (web), `desktop` (dev shell) and this job are the "CI
  # proves web + both platform builds" acceptance criterion.
  package:
    name: Package (${{ matrix.platform }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            electron-cache: ~/Library/Caches/electron
            builder-cache: ~/Library/Caches/electron-builder
            artifact-glob: |
              packages/desktop/release/*.zip
          - os: windows-latest
            platform: win
            electron-cache: ~\AppData\Local\electron\Cache
            builder-cache: ~\AppData\Local\electron-builder\Cache
            artifact-glob: |
              packages/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # NO ELECTRON_SKIP_BINARY_DOWNLOAD here: this job packages and then LAUNCHES
      # the result, so it needs the real binary.
      - name: Install dependencies
        run: npm ci

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.electron-cache }}
            ${{ matrix.builder-cache }}
          key: ${{ runner.os }}-eb-${{ hashFiles('package-lock.json') }}

      - name: Typecheck & build
        run: npx tsc -b

      - name: Package
        run: npm run package:${{ matrix.platform }}
        env:
          # Unsigned CI build. Code signing and (on macOS) notarization are a
          # release-pipeline task with secrets this repo does not hold; without
          # this, electron-builder tries to auto-discover a signing identity and
          # fails on a runner that has none.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The Accept's teeth: Tour One driven through the real packaged binary,
      # with no dev server behind it (the packaged Playwright config has no
      # `webServer` at all), plus the player-visible `inert` updater row.
      - name: Run packaged e2e
        run: npm run test:e2e:packaged -w @spacerquest/desktop

      # `if-no-files-found: error` is what turns "win package builds" into a
      # criterion that cannot silently rot into an empty upload — the same guard
      # the Tour One report artifact uses.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rimward-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
