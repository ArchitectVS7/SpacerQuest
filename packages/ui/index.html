<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spacer Quest · Rimward</title>
    <!--
      T-1701b · KNOWN LIMITATION, recorded rather than papered over: a PACKAGED
      offline launch cannot reach Google Fonts, so Chakra Petch and IBM Plex
      Mono do not load and the cockpit falls back to `system-ui` / `ui-monospace`
      — the stacks in `theme.css` already carry those fallbacks, so it degrades
      legibly rather than breaking. Self-hosting the two families is a named
      FOLLOW-UP, not this task: font binaries are their own deliverable with
      their own licensing question. No spec asserts anything about fonts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
